<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Idea Board · YT Toolkit</title>
    <link rel="icon" href="../../icons/icon32.png" />
    <link rel="stylesheet" href="../lib/base.css" />
    <link rel="stylesheet" href="board.css" />
  </head>
  <body>
    <header class="page-head">
      <h1>Idea board</h1>
      <span class="sub">Your videos, from idea to published. Drag cards between columns.</span>
      <div id="views" class="views" role="group" aria-label="View"></div>
      <form id="new" class="new"><input id="new-title" placeholder="New video idea…" required /><button class="primary">Add</button></form>
    </header>
    <div id="btools" class="btools-row"></div>
    <main id="board" class="board"></main>
    <script type="module" src="board.js"></script>
  </body>
</html>
