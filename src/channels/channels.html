<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Following · Outlier Lab</title>
    <link rel="icon" href="../../icons/icon32.png" />
    <link rel="stylesheet" href="../lib/base.css" />
    <link rel="stylesheet" href="channels.css" />
  </head>
  <body>
    <header class="page-head">
      <h1>Following</h1>
      <span class="sub" id="sub"></span>
      <form id="add" class="add">
        <input id="add-input" placeholder="@handle or channel link" spellcheck="false" required />
        <select id="add-role" aria-label="Why follow">
          <option value="learn">Learn from</option>
          <option value="competitor">Competitor</option>
        </select>
        <button class="primary" type="submit">Follow</button>
      </form>
    </header>
    <div class="toolbar">
      <div class="seg" id="filter">
        <button data-f="" class="on">All</button>
        <button data-f="learn">Learn from</button>
        <button data-f="competitor">Competitors</button>
      </div>
      <select id="sort" aria-label="Sort">
        <option value="upload">Latest upload</option>
        <option value="growth">Subscriber growth (30 days)</option>
        <option value="median">Median views</option>
        <option value="hit">Hit rate</option>
      </select>
      <span class="grow"></span>
      <span class="muted small" id="checked"></span>
      <button id="refresh" title="Refresh every followed channel now (~5 API units each)">Refresh now</button>
    </div>
    <main id="list"></main>
    <script type="module" src="channels.js"></script>
  </body>
</html>
