name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: find src test scripts -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Versions agree
        run: npm run check-version
      - name: Tests
        run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Companion tests
        working-directory: companion
        run: go vet ./... && go test ./...
